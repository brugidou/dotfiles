# foot — Solarized Dark, ported from ~/.Xresources (urxvt)
#
# Colour values are the same S_* hex constants defined in .Xresources, mapped
# onto foot's regular0-7 / bright0-7 names. foot takes hex WITHOUT a leading #.

font=Terminus:pixelsize=24

# Terminus is a bitmap font. Under Wayland, foot renders at each output's scale
# factor, so pixelsize=24 is exact on DP-1 (scale 1) but wants 36px on eDP-1
# (scale 1.5), and Terminus only ships 12/14/16/18/20/22/24/28/32. See the
# note at the bottom of this file if the laptop panel looks rough.
#
# dpi-aware=no means "scale by the output's scale factor" rather than by DPI,
# which is what makes text the same physical size on both monitors.
dpi-aware=no

# foot 1.27 supports light/dark themes and deprecates a bare [colors] section.
# Pinning to dark, so only the [colors-dark] palette below is ever used.
initial-color-theme=dark

# urxvt: URxvt.cutchars — characters that break a word for double-click select.
# Note -, @, ., / and _ are deliberately absent so paths, emails and flags
# select as a single word.
word-delimiters=`"'&()*,:;<=>?[\]^{|}$

[bell]
# urxvt: URxvt.visualBell: true
visual=yes
system=no

[scrollback]
# urxvt: URxvt.saveLines: 200000
lines=200000

[url]
# urxvt: URxvt.url-launcher: xdg-open (this is also foot's default).
# Open URLs with ctrl+shift+u, then the highlighted letter.
launch=xdg-open ${url}

[colors-dark]
background=002b36   # S_base03
foreground=657b83   # S_base00
# urxvt: *cursorColor: S_base1. First value is the text under the cursor.
cursor=002b36 93a1a1

# black / bright black
regular0=073642     # S_base02
bright0=002b36      # S_base03
# red / orange
regular1=dc322f     # S_red
bright1=cb4b16      # S_orange
# green / base01
regular2=859900     # S_green
bright2=586e75      # S_base01
# yellow / base00
regular3=b58900     # S_yellow
bright3=657b83      # S_base00
# blue / base0
regular4=268bd2     # S_blue
bright4=839496      # S_base0
# magenta / violet
regular5=d33682     # S_magenta
bright5=6c71c4      # S_violet
# cyan / base1
regular6=2aa198     # S_cyan
bright6=93a1a1      # S_base1
# white / brwhite
regular7=eee8d5     # S_base2
bright7=fdf6e3      # S_base3

# NOTE: do not set bold-text-in-bright=yes. In Solarized the bright slots are
# the grey base tones, not brighter colours, so bold text would turn grey.

###############################################################################
# Two things you may want later, deliberately NOT enabled
###############################################################################
# 1. SSH to hosts without foot's terminfo will misbehave (garbled keys, no
#    colour), because foot sets TERM=foot. If that bites some boxes:
#        term=xterm-256color
#    in the [main] section above. Costs a few foot-specific features locally.
#
# 2. Bitmap Terminus cannot be pixel-perfect at both scale 1 and scale 1.5.
#    Sizes whose 1.5x lands on a real bitmap: 12 (->18) and 16 (->24).
#    Either accept slight roughness on the laptop, or switch to a scalable
#    monospace font, which is crisp at any scale.
